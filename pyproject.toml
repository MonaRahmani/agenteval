[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agenteval"
version = "0.1.0"
description = "Seed reproducible GitHub test environments for evaluating AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Mona Rahmanimehr" }]
dependencies = [
    "typer",
    "pydantic",
    "pygithub",
    "pyyaml",
]

[project.optional-dependencies]
# Pinned to exact versions on purpose. ruff's formatter and mypy's inference both
# change between releases, so an unpinned range lets CI install a newer version
# than a developer has locally. The result is a CI failure — a reformatted file
# or a new type error — that cannot be reproduced on the machine that has to fix
# it. Bump these deliberately, in their own commit, so the diff is reviewable.
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.4",
    "mypy==2.3.1",
    "types-PyYAML",
]

[project.scripts]
agenteval = "agenteval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agenteval"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["github.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
